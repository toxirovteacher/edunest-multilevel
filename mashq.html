<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>EDUNEST · Mashq</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#141B2D;--red:#E3101F;--red2:#B80C18;--mist:#EEF1F6;--slate:#5A6378;--line:#DCE1EA;--ok:#0E8A4F;--okbg:#E4F5EC;--bad:#C4121D;--badbg:#FDE8E9;--fs:17px;--bar:64px}
*{box-sizing:border-box}
html,body{margin:0;background:#E9ECF2;color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button,select,input{font-family:inherit}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:30;height:var(--bar);display:flex;align-items:center;gap:10px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line)}
.bar .back{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:12px;background:var(--red);color:#fff;font-weight:800;font-size:15px;text-decoration:none;flex:none}
.bar .ttl{flex:1;min-width:0;line-height:1.15}
.bar .ttl b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl span{display:block;font-size:13px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs{display:flex;gap:4px;flex:none}
.fs button{width:42px;height:42px;border-radius:11px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:800;cursor:pointer}
.fs button:first-child{font-size:13px}.fs button:last-child{font-size:18px}

/* layout */
main{max-width:1240px;margin:0 auto;padding:14px 12px 130px}
.instr{background:#fff;border-radius:16px;padding:14px 16px;margin:0 0 12px;border-left:5px solid var(--ink);font-size:15px;line-height:1.5}
.instr b{display:block;font-size:13px;color:var(--red);margin-bottom:2px;letter-spacing:.02em}
.grid{display:grid;gap:12px}
@media(min-width:960px){
  .grid.split{grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);align-items:start}
  .grid.split>.col{position:sticky;top:calc(var(--bar) + 12px);max-height:calc(100vh - var(--bar) - 110px);overflow:auto;overscroll-behavior:contain}
  .jump{display:none!important}
}
.paper{position:relative;background:#fff;border-radius:18px;padding:20px 20px 24px;box-shadow:0 2px 0 rgba(20,27,45,.04);font-size:var(--fs);line-height:1.62}
.paper::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-image:var(--wm);background-size:340px 210px;opacity:.9}
.paper h2{margin:2px 0 14px;font-size:1.32em;line-height:1.2;font-weight:800;text-align:center}
.paper p{margin:0 0 .9em;text-wrap:pretty}
.paper p:last-child{margin-bottom:0}

/* side list (statements / headings) */
.side h3{margin:0 0 10px;font-size:15px;font-weight:800}
.side ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.side li{display:flex;gap:10px;align-items:flex-start;font-size:calc(var(--fs) - 1.5px);line-height:1.45;padding:8px 10px;border-radius:12px;background:var(--mist)}
.side li.used{opacity:.45}
.side li i{font-style:normal;flex:none;width:28px;height:28px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}

/* numbered items (texts / paragraphs) */
.box{border:1.5px solid var(--line);border-radius:16px;padding:14px 14px 16px;margin:0 0 12px}
.box:last-child{margin-bottom:0}
.boxh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.boxh strong{font-size:1em;flex:1;min-width:140px}
.num{flex:none;display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-weight:800;font-size:15px;line-height:1}
.pick{position:relative;flex:none}
.pick select{appearance:none;-webkit-appearance:none;height:46px;min-width:96px;max-width:min(320px,70vw);padding:0 38px 0 14px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:16px;font-weight:800;cursor:pointer}
.pick::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.pick select:invalid,.pick select.empty{border-style:dashed;color:var(--slate)}

/* gaps */
.gapw{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;margin:2px 2px;white-space:nowrap}
.gapw .num{min-width:26px;height:26px;font-size:13px;border-radius:8px}
.gap{width:8em;max-width:56vw;height:40px;padding:0 10px;border:0;border-bottom:2.5px solid var(--ink);border-radius:10px 10px 4px 4px;background:var(--mist);color:var(--ink);font-size:max(16px,.95em);font-weight:700}
.gap:focus{background:#fff;outline:2px solid var(--ink);outline-offset:1px}
.row{padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row.one{display:flex;gap:10px;align-items:baseline}.row.one>.num{flex:none;transform:translateY(-2px)}.row.one .gapw{margin-left:1px}

.paper h3.sub{margin:22px 0 8px;font-size:1em;font-weight:800;line-height:1.35;padding-top:16px;border-top:2px solid var(--mist)}
.paper h3.sub:first-child{margin-top:0;padding-top:0;border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chips span,.chips s{padding:5px 11px;border-radius:999px;background:var(--mist);font-size:.88em;font-weight:700}
.chips s{opacity:.5}
.row.exm{color:var(--slate);font-size:.94em}.row.exm b{display:inline-block;margin-right:8px;font-size:.78em;color:var(--ok);background:var(--okbg);padding:2px 8px;border-radius:6px}
.pick.in select{height:40px;min-width:0;font-size:max(16px,.95em);padding:0 32px 0 10px;border-width:2px}
.pick.in::after{right:12px}
/* question cards */
.qs{display:grid;gap:10px}
.note{font-size:14.5px;font-weight:700;color:var(--slate);padding:4px 4px 0}
.q{background:#fff;border-radius:16px;padding:14px;font-size:calc(var(--fs) - 1px);line-height:1.5}
.qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.qh .num{margin-top:-1px}
.opts{display:grid;gap:7px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:inherit;line-height:1.4;cursor:pointer}
.opt i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.opt[aria-pressed="true"] i{border-color:#fff;background:#fff;color:var(--ink)}
.tfn{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tfn .opt{justify-content:center;text-align:center;font-weight:800;font-size:14px;padding:8px 6px}

/* audio */
.player{position:sticky;top:calc(var(--bar) + 8px);z-index:20;box-shadow:0 8px 22px rgba(20,27,45,.25);background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px;margin:0 0 12px;display:flex;align-items:center;gap:14px}
.player .pp{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;display:grid;place-items:center}
.player .pp svg{width:24px;height:24px;fill:currentColor}
.player .pr{flex:1;min-width:0}
.player .tm{display:flex;justify-content:space-between;font-size:13px;opacity:.8;margin-top:6px;font-variant-numeric:tabular-nums}
.player input[type=range]{width:100%;accent-color:var(--red);height:28px;margin:0}
.player .sk{flex:none;height:40px;padding:0 10px;border-radius:10px;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.player .lbl{font-size:13px;font-weight:700;opacity:.85}

/* results */
.ok .gap,.ok select{border-color:var(--ok)!important;background:var(--okbg)!important}
.bad .gap,.bad select{border-color:var(--bad)!important;background:var(--badbg)!important}
.q.ok{box-shadow:inset 0 0 0 2px var(--ok)}.q.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.box.ok{border-color:var(--ok)}.box.bad{border-color:var(--bad)}
.opt.right{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ink)!important}
.opt.right i{border-color:var(--ok)!important;background:var(--ok)!important;color:#fff!important}
.opt.wrong{border-color:var(--bad)!important;background:var(--badbg)!important;color:var(--ink)!important}
.opt.wrong i{border-color:var(--bad)!important;background:var(--bad)!important;color:#fff!important}
.fix{display:inline-block;margin:0 3px;padding:1px 8px;border-radius:8px;background:var(--ok);color:#fff;font-size:.82em;font-weight:800;white-space:nowrap}
.score{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px 16px;margin:0 0 12px}
.score .big{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;background:conic-gradient(var(--ok) calc(var(--p)*1%),#cfd5e0 0)}
.score .big span{width:62px;height:62px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font-size:19px}
.score p{margin:0;font-size:15px;line-height:1.45;color:var(--slate)}.score p b{display:block;color:var(--ink);font-size:17px}
.reveal{display:block;width:100%;min-height:58px;border:2px dashed #b9c1d3;background:#fff;border-radius:16px;font-size:16px;font-weight:800;color:var(--ink);cursor:pointer;margin:12px 0 0}
.script{margin-top:12px}
.script mark{background:#FFE58A;color:inherit;border-radius:4px;padding:0 2px;box-shadow:0 0 0 1px #F2C94C}
.script mark b{font-size:.75em;color:var(--red2);margin-right:3px}

/* footer actions */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(233,236,242,0),rgba(233,236,242,.96) 34%)}
.foot .in{max-width:620px;margin:0 auto;display:flex;gap:8px}
.foot button{flex:1;min-height:58px;border:0;border-radius:16px;background:var(--red);color:#fff;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 10px 26px rgba(227,16,31,.3)}
.foot button.alt{flex:none;width:auto;padding:0 18px;background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none;font-size:15px}
.foot button.warn{background:var(--ink);box-shadow:none}
.foot .cnt{display:block;font-size:12.5px;font-weight:600;opacity:.85;margin-top:2px}
.jump{position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:29;height:42px;padding:0 14px;border-radius:21px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(20,27,45,.3);cursor:pointer}

/* menu + messages */
.menu{max-width:720px;margin:0 auto;display:grid;gap:10px}
.menu a{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px 16px;color:var(--ink);text-decoration:none;font-weight:700;min-height:64px}
.menu a small{display:block;font-weight:500;color:var(--slate);font-size:13px}
.menu a em{margin-left:auto;font-style:normal;font-size:13px;font-weight:800;color:var(--ok)}
.msg{max-width:440px;margin:70px auto;background:#fff;border-radius:20px;padding:26px;text-align:center}
.msg h2{margin:0 0 8px}.msg p{color:var(--slate);margin:0 0 18px;line-height:1.5}
.msg a{display:inline-flex;min-height:52px;align-items:center;padding:0 22px;border-radius:14px;background:var(--red);color:#fff;font-weight:800;text-decoration:none}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--red);margin:0 auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:520px){main{padding:10px 8px 130px}.paper{padding:16px 14px 20px;border-radius:16px}.bar .ttl span{display:none}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}

[hidden]{display:none!important}
textarea{-webkit-user-select:text;user-select:text;font-family:inherit}
.side li span b{display:block;margin-bottom:3px;font-size:1.02em}
.nt{margin-top:12px;padding:11px 13px;border-radius:12px;background:#FFF7DB;border-left:4px solid #E0A800;font-size:calc(var(--fs) - 2px);line-height:1.52}
.nt .k{display:inline-block;margin:0 8px 4px 0;padding:2px 9px;border-radius:7px;background:#7A5A00;color:#fff;font-size:.8em;font-weight:800;white-space:nowrap}
.nt i{font-style:italic;font-weight:600}
.after{margin-top:12px}
.after h3{margin:22px 0 8px;font-size:1.02em;font-weight:800;color:var(--red2);padding-top:16px;border-top:2px solid var(--mist)}
.after h3:first-child{margin-top:0;padding-top:0;border-top:0}
.after h4{margin:0 0 8px;font-size:1.05em;font-weight:800;text-align:center}
.after p{font-size:calc(var(--fs) - 1.5px)}
.trl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.trl li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--mist);font-size:calc(var(--fs) - 2px);line-height:1.4}
.trl li i{font-style:normal;flex:none;width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.trl li span b{display:block}.trl li span em{font-style:normal;color:var(--slate)}
.vl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.vl div{padding:8px 11px;border-radius:12px;background:var(--mist);font-size:calc(var(--fs) - 2px);line-height:1.35}
.vl b{display:block}.vl span{color:var(--slate)}

/* vocabulary cards */
.vtools{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.vtools button{min-height:46px;padding:0 16px;border-radius:13px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:800;font-size:14.5px;cursor:pointer}
.vtools button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.vtools span{font-size:13.5px;color:var(--slate);font-weight:600}
.vgrid{display:grid;gap:12px}
@media(min-width:900px){.vgrid{grid-template-columns:1fr 1fr;align-items:start}}
.vc{padding:0;overflow:hidden}
.vc header{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--ink);color:#fff}
.vc header .num{background:var(--red)}
.vc header h3{margin:0;flex:1;min-width:0;font-size:1.12em;line-height:1.2;font-weight:800}
.vc header em{flex:none;font-style:normal;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.vc .vb{padding:14px 16px 16px}
.vc .tr{margin:0 0 6px;font-weight:800;color:var(--red2);font-size:1.02em;line-height:1.35}
.vc .df{margin:0 0 10px;font-size:.92em;color:var(--slate);line-height:1.45}
.vc .df b{color:var(--ink);font-weight:700}
.vc ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:9px;counter-reset:e}
.vc ol li{counter-increment:e;position:relative;padding-left:26px;line-height:1.45}
.vc ol li::before{content:counter(e);position:absolute;left:0;top:2px;width:19px;height:19px;border-radius:6px;background:var(--mist);font-size:11.5px;font-weight:800;display:grid;place-items:center}
.vc ol li b{background:#FFF1B8;border-radius:4px;padding:0 3px}
.vc .uz{display:block;margin-top:2px;color:var(--slate);font-size:.9em;font-style:italic;line-height:1.4}
.vc .sp{margin-top:14px;padding:12px 13px;border-radius:14px;background:var(--mist)}
.vc .sp .spk{display:block;font-size:12px;font-weight:800;color:#8A6400;letter-spacing:.03em;margin-bottom:5px}
.vc .sp p{margin:0 0 5px;line-height:1.45}
.vc .sp p.sq{font-weight:800}
.vc .sp p b{background:#FFF1B8;border-radius:4px;padding:0 3px}
.hideuz .uz,.hideuz .tr{filter:blur(6px);cursor:pointer;transition:filter .15s}
.hideuz .uz.show,.hideuz .tr.show{filter:none}

/* writing */
.wwrap{max-width:860px;margin:0 auto}
.wsit{font-weight:700;margin:0 0 12px!important}
.whint{margin:14px 4px 0;font-size:13.5px;color:var(--slate);text-align:center}
.mail{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;background:#FAFBFD}
.mail p{margin:0 0 .8em;white-space:pre-line}.mail p:last-child{margin:0}
.wt{margin-top:12px}
.wt .wh{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.wt .tag{flex:none;padding:5px 10px;border-radius:9px;background:var(--ink);color:#fff;font-weight:800;font-size:13px;white-space:nowrap;margin-top:1px}
.wt .wq{font-weight:700;line-height:1.45}
.wt textarea{display:block;width:100%;min-height:150px;padding:12px 13px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:max(16px,.95em);line-height:1.5;resize:vertical}
.wt textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
.wbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 0;font-size:13.5px;color:var(--slate);font-weight:600}
.wbar .wc{padding:3px 10px;border-radius:999px;background:var(--mist);color:var(--ink);font-weight:800}
.wbar .wc.in{background:var(--okbg);color:var(--ok)}
.wbar .ai{margin-left:auto;padding:3px 10px;border-radius:999px;border:1.5px dashed #b9c1d3;font-weight:700;font-size:12.5px}
.model{margin-top:12px;border-radius:14px;border:1.5px solid #BFE3CD;background:#F3FBF6;padding:14px 16px}
.model .mh{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px;font-size:13px;font-weight:800}
.model .mh span:first-child{color:var(--ok)}.model .mh span:last-child{color:var(--slate)}
.model p{margin:0 0 .8em;white-space:pre-line}.model p:last-child{margin:0}

/* one-sitting mock exam */
.xtabs{position:sticky;top:var(--bar);z-index:29;display:flex;align-items:center;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.xtabs::-webkit-scrollbar{display:none}
.xtabs button{flex:none;min-width:54px;height:46px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:800;font-size:14px;cursor:pointer;line-height:1.1}
.xtabs button small{display:block;font-size:11px;font-weight:700;color:var(--slate)}
.xtabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}.xtabs button.on small{color:#cfd5e3}
.xtabs button.full:not(.on){border-color:var(--ok)}.xtabs button.full:not(.on) small{color:var(--ok)}
.xtabs .xend{margin-left:auto;border-color:var(--red);color:var(--red)}
.xtm{flex:none;display:inline-flex;align-items:center;height:42px;padding:0 12px;border-radius:11px;background:var(--ink);color:#fff;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.xtm.low{background:var(--red)}
body.exam main{padding-top:12px}
@media(min-width:960px){body.exam main{padding-bottom:96px}body.exam .grid.split>.col{position:static;max-height:var(--xh,60vh)}}
.xin{max-width:560px;margin:26px auto;background:#fff;border-radius:22px;padding:26px 22px;text-align:center}
.xin h2{margin:0 0 4px;font-size:24px;line-height:1.2}.xin .sub{color:var(--slate);margin:0 0 18px;font-weight:600}
.xin .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}
.xin .facts div{background:var(--mist);border-radius:14px;padding:12px 6px}
.xin .facts b{display:block;font-size:24px;line-height:1.1}.xin .facts span{font-size:12.5px;color:var(--slate);font-weight:700}
.xin ul{text-align:left;margin:0 0 20px;padding:0 0 0 20px;line-height:1.55;color:#2b3550;font-size:15.5px}
.xin ul li{margin-bottom:4px}
.xbtn{display:block;width:100%;min-height:58px;border:0;border-radius:16px;background:var(--red);color:#fff;font-size:17px;font-weight:800;cursor:pointer}

.aitypes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.aitypes button{min-height:76px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-align:left;padding:10px 12px;font-family:inherit}
.aitypes button b{display:block;font-size:16px}.aitypes button small{display:block;color:var(--slate);font-size:12.5px;margin-top:2px;line-height:1.3}
.aitypes button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.aitypes button[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.aistep textarea{display:block;width:100%;padding:12px 13px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:16px;line-height:1.5;resize:vertical}
.aistep textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
.aistep .tsk{min-height:96px}.aistep .ans{min-height:220px}
.aihist{display:grid;gap:8px}
.aihist button{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);text-align:left;padding:8px 12px;cursor:pointer;font-family:inherit}
.aihist .hl{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;background:#2B3A67;font-size:14px}
.aihist .hx{flex:1;min-width:0}.aihist .hx b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.aihist .hx small{color:var(--slate);font-size:12.5px}
@media(max-width:520px){.aitypes{grid-template-columns:1fr}.aitypes button{min-height:58px}.air .hd{padding:16px 14px}.air .sec{padding:14px}}

<body>
<header class="bar"><a class="back" id="back" href="./#/me">← Xarita</a><div class="ttl"><b id="ttl">Mashq</b><span id="sub">EDUNEST · A'zamjon Toxirov</span></div><div class="fs"><button id="fsm" aria-label="Matnni kichraytirish">A</button><button id="fsp" aria-label="Matnni kattalashtirish">A</button></div></header>
<main id="main"><div class="msg"><div class="spin"></div><p>Mashq ochilmoqda…</p></div></main>
<div class="foot" id="foot" hidden><div class="in" id="footin"></div></div>
<button class="jump" id="jump" hidden></button>
<script>
const ST='edunest_mlb:';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const H=Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const own=e=>/^(INPUT|TEXTAREA)$/.test((e&&e.tagName)||'');
document.addEventListener('contextmenu',e=>{if(!own(e.target))e.preventDefault()});
document.addEventListener('copy',e=>{if(!own(document.activeElement))e.preventDefault()});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&/^[spu]$/i.test(e.key))e.preventDefault()});

let SESSION=null;try{SESSION=JSON.parse(ls(ST+'session')||'null')}catch(e){}
const UID=SESSION&&SESSION.id||'anon';
function who(){let p=null;try{p=JSON.parse(ls(ST+'p:'+UID)||'null')}catch(e){}const n=p&&p.student?p.student.name:'';return (n||'EDUNEST')+(p&&p.student&&p.student.id?' · '+p.student.id:'')}
function watermark(){const t=esc(who());const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='340' height='210'><text x='10' y='120' transform='rotate(-22 170 105)' font-family='Arial' font-size='15' font-weight='700' fill='rgba(20,27,45,0.055)'>${t}</text></svg>`;
  document.documentElement.style.setProperty('--wm',`url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`)}

function fail(h,p,link){$('#main').innerHTML=`<div class="msg"><h2>${esc(h)}</h2><p>${esc(p)}</p><a href="${link||'./#/login'}">${link?'Xaritaga qaytish':'Platformaga kirish'}</a></div>`;$('#foot').hidden=true}
async function decrypt(buf){
  const K=ls(ST+'k');if(!K)throw new Error('nokey');
  if(String.fromCharCode(...buf.slice(0,4))!=='EDN1')throw new Error('bad');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(K),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:buf.slice(4,20),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(20,32)},key,buf.slice(32)));
}
async function load(name){const r=await fetch(name+'.bin',{cache:'no-cache'});if(!r.ok)throw new Error('net');return decrypt(new Uint8Array(await r.arrayBuffer()))}

/* ---------- answer checking ---------- */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’‘`]/g,"'").replace(/[£$€]/g,'').replace(/[.,;:!?]+$/,'').replace(/\bcan't\b/g,'cannot').replace(/won't\b/g,'will not').replace(/n't\b/g,' not').replace(/'ve\b/g,' have').replace(/'re\b/g,' are').replace(/'m\b/g,' am').replace(/'ll\b/g,' will').replace(/\s+/g,' ').trim();
const isOk=(v,acc)=>!!norm(v)&&acc.some(a=>norm(a)===norm(v));

const rich=x=>esc(x).replace(/\x01/g,'<b>').replace(/\x02/g,'</b>').replace(/\x03/g,'<i>').replace(/\x04/g,'</i>');
let DOC=null,SEC=null,ANS={},DONE=null,armed=false,audioUrl=null,EX=null,WR={};
const OPENED=Date.now();
function toast(m){let d=document.getElementById('mtoast');if(!d){d=document.createElement('div');d.id='mtoast';d.setAttribute('role','status');d.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);max-width:min(92vw,460px);background:#141B2D;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;z-index:9999;box-shadow:0 12px 30px rgba(0,0,0,.3);text-align:center;transition:opacity .2s';document.body.appendChild(d)}d.textContent=m;d.style.opacity=1;clearTimeout(d._t);d._t=setTimeout(()=>d.style.opacity=0,3200)}
const key=()=>ST+'mashq:'+UID+':'+H.d+':'+(EX?'exam':SEC.id);
function save(){if(EX){lset(key(),JSON.stringify({a:ANS,t0:EX.t0,part:EX.part,r:EX.r}));return}lset(key(),JSON.stringify({a:ANS,r:DONE,w:WR}))}
function restore(){let s=null;try{s=JSON.parse(ls(key())||'null')}catch(e){}ANS=(s&&s.a)||{};DONE=(s&&s.r)||null;WR=(s&&s.w)||{}}

function gapHTML(n){return `<span class="gapw" data-q="${n}"><span class="num">${n}</span><input class="gap" data-n="${n}" aria-label="Savol ${n}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next"></span>`}
const fillGaps=x=>esc(x).replace(/\{\{(\d+)(?::([^}]+))?\}\}/g,(_,n,o)=>o?`<span class="gapw" data-q="${n}"><span class="num">${n}</span><span class="pick in"><select data-n="${n}" aria-label="Savol ${n}"><option value="">…</option>${o.split('|').map(v=>`<option>${v}</option>`).join('')}</select></span></span>`:gapHTML(n));
function sizeGaps(){document.querySelectorAll('input.gap').forEach(i=>{if(SEC.gapw){i.style.width=SEC.gapw+'em';return}const a=(SEC.ans[i.dataset.n]||[''])[0];const L=Math.max(5,Math.min(30,a.length+2));i.style.width=L*.62+'em'})}
function pickHTML(n){const o=SEC.sel[n];if(!o)return '';const side=(SEC.side&&SEC.side.items)||[];
  return `<span class="pick"><select data-n="${n}" aria-label="Savol ${n} uchun javob"><option value="">Tanlang</option>${o.map(L=>{const t=(side.find(s=>s[0]===L)||[])[1]||'';return `<option value="${L}">${L}${t?' — '+esc(t.length>58?t.slice(0,56)+'…':t):''}</option>`}).join('')}</select></span>`}

function blockHTML(b){
  if(b.t==='h')return `<h2>${esc(b.x)}</h2>`;
  if(b.t==='p')return `<p>${fillGaps(b.x)}</p>`;
  if(b.t==='row'){const g=b.x.match(/\{\{(\d+)/g)||[];if(g.length===1){const n=g[0].slice(2);return `<div class="row one" data-q="${n}"><span class="num">${n}</span><span>${fillGaps(b.x).replace(/<span class="num">\d+<\/span>/,'')}</span></div>`}return `<div class="row">${fillGaps(b.x)}</div>`}
  if(b.t==='sub')return `<h3 class="sub">${esc(b.x)}</h3>`;
  if(b.t==='ex')return `<div class="row exm"><b>Namuna</b>${esc(b.x)}</div>`;
  if(b.t==='chips')return `<div class="chips">${b.x.map(w=>w[0]==='~'?`<s>${esc(w.slice(1))}</s>`:`<span>${esc(w)}</span>`).join('')}</div>`;
  if(b.t==='box')return `<div class="box" data-q="${b.n}"><div class="boxh"><span class="num">${b.n}</span><strong>${esc(b.title)}</strong>${pickHTML(b.n)}</div><div>${esc(b.x)}</div><div class="nt" data-nt="${b.n}" hidden></div></div>`;
  return '';
}
function qHTML(q){
  if(q.t==='note')return `<div class="note">${esc(q.x)}</div>`;
  if(q.t==='gap')return `<div class="q" data-q="${q.n}"><div class="qh"><span class="num">${q.n}</span><div>${fillGaps(q.q).replace(gapHTML(q.n),`<span class="gapw" data-q="${q.n}"><input class="gap" data-n="${q.n}" aria-label="Savol ${q.n}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></span>`)}</div></div></div>`;
  const opts=q.t==='tfn'?[['TRUE','True'],['FALSE','False'],['NO INFORMATION','No info']]:q.o;
  return `<div class="q" data-q="${q.n}"><div class="qh"><span class="num">${q.n}</span><div>${esc(q.q)}</div></div><div class="${q.t==='tfn'?'tfn':'opts'}">${opts.map(o=>`<button type="button" class="opt" data-n="${q.n}" data-v="${esc(o[0])}" aria-pressed="false">${q.t==='tfn'?'':`<i>${o[0]}</i>`}<span>${esc(o[1])}</span></button>`).join('')}</div></div>`;
}

function nums(){return Object.keys(SEC.ans).map(Number).sort((a,b)=>a-b)}
function answered(){return nums().filter(n=>norm(ANS[n])).length}

function render(){
  if(SEC.kind==='study'){renderStudy();return}
  if(SEC.kind==='write'){renderWrite();return}
  const s=SEC,split=s.layout==='split';
  $('#ttl').textContent=DOC.short+' · '+s.label;$('#sub').textContent=s.title;document.title='EDUNEST · '+DOC.short+' · '+s.label;
  let left='',right='';
  const paper=!s.blocks.length?'':`<div class="paper">${s.blocks.map(blockHTML).join('')}${s.kind==='listen'?'<div id="scr"></div>':''}</div>`;
  if(s.side){const side=`<div class="paper side"><h3>${esc(s.side.title)}</h3><ol>${s.side.items.map(i=>`<li data-l="${i[0]}"><i>${i[0]}</i><span>${i[2]?`<b>${esc(i[1])}</b>${esc(i[2])}`:esc(i[1])}</span></li>`).join('')}</ol></div>`;if(s.sideAfter){left=paper;right=side}else{left=side;right=paper}}
  else if(s.qs.length&&!paper){left=`<div class="qs">${s.qs.map(qHTML).join('')}</div>`}
  else if(s.qs.length){left=paper;right=`<div class="qs">${s.qs.map(qHTML).join('')}</div>`}
  else{left=paper}
  $('#main').innerHTML=`<div id="res"></div>${s.kind==='listen'?'<div id="pl"></div>':''}<div class="instr"><b>${esc(s.label)}</b>${esc(s.instr)}</div>
    <div class="grid ${split&&right?'split':''}"><div class="col" id="cA">${left}</div>${right?`<div class="col" id="cB">${right}</div>`:''}</div><div id="aft"></div>`;
  watermark();sizeGaps();
  // restore answers
  document.querySelectorAll('.gap').forEach(i=>{i.value=ANS[i.dataset.n]||'';i.addEventListener('input',()=>{ANS[i.dataset.n]=i.value;armed=false;save();foot()});
    i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const all=[...document.querySelectorAll('.gap')];const nx=all[all.indexOf(i)+1];nx?nx.focus():i.blur()}})});
  document.querySelectorAll('select[data-n]').forEach(sl=>{sl.value=ANS[sl.dataset.n]||'';sl.classList.toggle('empty',!sl.value);sl.addEventListener('change',()=>{ANS[sl.dataset.n]=sl.value;sl.classList.toggle('empty',!sl.value);armed=false;save();used();foot()})});
  document.querySelectorAll('.opt').forEach(b=>{b.setAttribute('aria-pressed',ANS[b.dataset.n]===b.dataset.v);b.addEventListener('click',()=>{if(DONE)return;ANS[b.dataset.n]=b.dataset.v;armed=false;save();
    document.querySelectorAll(`.opt[data-n="${b.dataset.n}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));foot()})});
  used();
  if(s.kind==='listen')player();
  // mobile jump between text and questions
  const jb=$('#jump');const jl=s.qs.length?['Savollar ↓','Matn ↑']:s.sideAfter?['Matnlar ↓','Savollar ↑']:['Matn ↓','Sarlavhalar ↑'];
  if(right&&(s.qs.length||s.side)){jb.hidden=false;const upd=()=>{const B=$('#cB');if(!B)return;const below=B.getBoundingClientRect().top>innerHeight*.6;jb.textContent=below?jl[0]:jl[1];jb.onclick=()=>(below?B:$('#cA')).scrollIntoView({behavior:'smooth',block:'start'})};addEventListener('scroll',upd,{passive:true});upd()}else jb.hidden=true;
  if(EX)examChrome();
  if(DONE)showResult(false);
  foot();
}
function used(){if(!SEC.side)return;const v=new Set(Object.values(ANS));document.querySelectorAll('.side li').forEach(li=>li.classList.toggle('used',v.has(li.dataset.l)))}

function goDone(){const canDone=H.a&&H.s!=null;location.href=canDone?'./#/me/a/'+encodeURIComponent(H.a)+'/done/'+(+H.s):'./#/me'}
function foot(){
  if(EX){examFoot();return}
  const f=$('#footin');$('#foot').hidden=false;
  if(SEC.kind==='study'||SEC.kind==='write'){f.innerHTML=`<button id="dn">${H.a&&H.s!=null?'Bajardim':'Xaritaga qaytish'}</button>`;
    $('#dn').onclick=()=>{if(H.a&&H.s!=null){
      if(SEC.kind==='write'&&!Object.values(WR.t||{}).some(x=>typeof x==='string'&&x.trim().split(/\s+/).length>=30)){toast('Avval kamida bitta javobni yozing (30 so‘zdan ko‘p). Shundan keyin “Bajardim” ishlaydi.');return}
      if(SEC.kind==='study'){if(Date.now()-OPENED<60000){toast('Avval iboralarni o‘qib chiqing. Kamida 1 daqiqa ishlang.');return}lset(key(),JSON.stringify({a:ANS,r:DONE,w:WR,v:Date.now()}))}}
      goDone()};return}
  const total=nums().length,a=answered();
  if(!DONE){
    f.innerHTML=`<button id="chk" class="${armed?'warn':''}">${armed?`${total-a} ta savol bo‘sh — baribir tekshirish`:'Javoblarni tekshirish'}<span class="cnt">${a} / ${total} javob yozildi</span></button>`;
    $('#chk').onclick=()=>{if(a<total&&!armed){armed=true;foot();return}check()};
  }else{
    const canDone=H.a&&H.s!=null;
    f.innerHTML=`<button class="alt" id="again">Qayta ishlash</button>${canDone?`<button id="dn">Bajardim</button>`:`<button id="dn">Xaritaga qaytish</button>`}`;
    $('#again').onclick=()=>{DONE=null;ANS={};armed=false;save();render();scrollTo(0,0)};
    $('#dn').onclick=()=>{location.href=canDone?'./#/me/a/'+encodeURIComponent(H.a)+'/done/'+(+H.s):'./#/me'};
  }
}

function check(){
  const res={};nums().forEach(n=>res[n]=isOk(ANS[n],SEC.ans[n]));
  DONE={ok:Object.values(res).filter(Boolean).length,of:nums().length,res};save();showResult(true);foot();
}
function showResult(scroll){
  const {ok,of,res}=DONE;const pc=Math.round(ok/of*100);
  const msg=pc===100?'Mukammal! Hammasi to‘g‘ri.':pc>=67?'Yaxshi natija. Xatolarni ko‘rib chiqing.':pc>=34?'Yomon emas. Qizil belgilangan joylarni qayta o‘qing.':'Matnga qaytib, javob joylarini topishga harakat qiling.';
  $('#res').innerHTML=`<div class="score"><div class="big" style="--p:${pc}"><span>${ok}/${of}</span></div><p><b>${msg}</b>Yashil — to‘g‘ri, qizil — xato. To‘g‘ri javob yonida ko‘rsatilgan.</p></div>`;
  document.querySelectorAll('input.gap,select[data-n]').forEach(e=>e.disabled=true);
  nums().forEach(n=>{
    const good=res[n];const right=SEC.ans[n][0];
    document.querySelectorAll(`[data-q="${n}"]`).forEach(el=>{el.classList.remove('ok','bad');el.classList.add(good?'ok':'bad')});
    const btns=document.querySelectorAll(`.opt[data-n="${n}"]`);
    if(btns.length){btns.forEach(b=>{b.disabled=true;if(b.dataset.v===right)b.classList.add('right');else if(b.dataset.v===ANS[n])b.classList.add('wrong')})}
    else if(!good){const host=document.querySelector(`.gapw[data-q="${n}"]`)||document.querySelector(`.box[data-q="${n}"] .boxh`);if(host&&!host.querySelector('.fix'))host.insertAdjacentHTML('beforeend',`<span class="fix">✓ ${esc(SEC.ans[n].join(' / '))}</span>`)}
  });
  if(SEC.kind==='listen'){$('#scr').innerHTML=`<button class="reveal" id="rv">Skriptni ochish — javoblar sariq rangda</button>`;$('#rv').onclick=script}
  if(SEC.notes)document.querySelectorAll('[data-nt]').forEach(el=>{const n=el.dataset.nt;if(!SEC.notes[n])return;el.innerHTML=`<span class="k">${n} · Javob: ${esc(SEC.ans[n][0])}</span>${rich(SEC.notes[n])}`;el.hidden=false});
  if(SEC.after&&$('#aft')&&!$('#aft').innerHTML){$('#aft').innerHTML=`<button class="reveal" id="rva">${esc(SEC.afterLabel||'Tarjimani ochish')}</button>`;$('#rva').onclick=()=>{$('#aft').innerHTML=`<div class="paper after">${SEC.after.map(afterHTML).join('')}</div>`;watermark()}}
  if(scroll)scrollTo({top:0,behavior:'smooth'});
}
function afterHTML(b){
  if(b.t==='ah')return `<h3>${esc(b.x)}</h3>`;
  if(b.t==='at')return `<h4>${esc(b.x)}</h4>`;
  if(b.t==='ap')return `<p>${rich(b.x)}</p>`;
  if(b.t==='atr')return `<ol class="trl">${b.x.map(r=>`<li><i>${esc(r[0])}</i><span><b>${esc(r[1])}</b><em>${esc(r[2])}</em></span></li>`).join('')}</ol>`;
  if(b.t==='av')return `<div class="vl">${b.x.map(r=>`<div><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}</div>`;
  return '';
}

/* ---------- vocabulary: study cards ---------- */
function renderStudy(){
  const s=SEC;$('#ttl').textContent=DOC.short+' · '+s.label;$('#sub').textContent=s.title;document.title='EDUNEST · '+s.label+' · '+s.title;$('#jump').hidden=true;
  const card=it=>`<article class="paper vc"><header><span class="num">${it.n}</span><h3>${esc(it.w)}</h3><em>${esc(it.ty)}</em></header><div class="vb">
    <p class="tr">${esc(it.tr)}</p>${it.df?`<p class="df"><b>Ta’rif:</b> ${esc(it.df)}</p>`:''}
    <ol>${it.ex.map(e=>`<li>${rich(e[0])}<span class="uz">${esc(e[1])}</span></li>`).join('')}</ol>
    <div class="sp"><span class="spk">${esc(it.sp[0])}</span><p class="sq">Q: ${esc(it.sp[1])}</p><p>A: ${rich(it.sp[2])}</p><span class="uz">${esc(it.sp[3])}</span></div></div></article>`;
  $('#main').innerHTML=`<div class="instr"><b>${esc(s.label)} · ${esc(s.title)}</b>${esc(s.instr)}</div>
    <div class="vtools"><button id="hz" aria-pressed="false">Tarjimani yashirish</button><span id="hzt">${s.items.length} ta ibora</span></div>
    <div class="vgrid" id="vg">${s.items.map(card).join('')}</div>`;
  watermark();
  $('#hz').onclick=()=>{const on=$('#vg').classList.toggle('hideuz');$('#hz').setAttribute('aria-pressed',on);$('#hz').textContent=on?'Tarjimani ko‘rsatish':'Tarjimani yashirish';$('#hzt').textContent=on?'O‘zingizni sinang: tarjimani ko‘rish uchun ustiga bosing':s.items.length+' ta ibora';document.querySelectorAll('.uz.show,.tr.show').forEach(e=>e.classList.remove('show'))};
  $('#vg').onclick=e=>{const t=e.target.closest('.uz,.tr');if(t&&$('#vg').classList.contains('hideuz'))t.classList.toggle('show')};
  foot();
}

/* ---------- writing: task, own attempt, model answer ---------- */
const wcount=t=>(String(t||'').trim().match(/\S+/g)||[]).length;
function renderWrite(){
  const s=SEC;$('#ttl').textContent=DOC.short+' · '+s.label;$('#sub').textContent=s.title;document.title='EDUNEST · '+DOC.short+' · '+s.title;$('#jump').hidden=true;
  const paras=a=>a.map(p=>`<p>${esc(p)}</p>`).join('');
  const head=(s.sit||s.mail)?`<div class="paper"><h2>${esc(s.title)}</h2>${s.sit?`<p class="wsit">${esc(s.sit)}</p>`:''}${s.mail?`<div class="mail">${paras(s.mail)}</div>`:''}</div>`:'';
  const ai=aiEnabled();
  const task=(t,i)=>`<div class="paper wt" data-t="${i}"><div class="wh"><span class="tag">${esc(t.tag)}</span><div class="wq">${esc(t.q)}</div></div>
    <textarea data-w="${i}" placeholder="Javobingizni shu yerga yozib ko‘ring…" aria-label="${esc(t.tag)} uchun javobingiz" autocapitalize="sentences" spellcheck="false"></textarea>

/* progress from the student's last checks: average level, weakest criterion, trend, most repeated error types */
function aiInsights(C){
  const ok=C.filter(c=>c.r&&c.r.scores);if(!ok.length)return '';
  const avg=Math.round(ok.reduce((s,c)=>s+(c.score||0),0)/ok.length);const lv=avg>=65?'C1':avg>=51?'B2':avg>=38?'B1':'B1 dan past';
  const crit=AI_C.map(([k,n])=>{const w=ok.filter(c=>k in c.r.scores);return [n,w.length?w.reduce((s,c)=>s+(c.r.scores[k]||0),0)/w.length:99]}).sort((a,b)=>a[1]-b[1])[0];
  const d=ok.length>1?ok[0].score-ok[1].score:null;
  const cnt={};ok.forEach(c=>(c.r.mistakes||[]).forEach(m=>{if(m.kind!=='tip')cnt[m.type]=(cnt[m.type]||0)+1}));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return `<div class="aiins"><div><small>O‘rtacha</small><b>${esc(lvShort(lv))} · ${avg}/75</b><em>${ok.length} ta tekshiruv</em></div>
    <div><small>Eng zaif mezon</small><b>${esc(crit[0])}</b><em>o‘rtacha ${crit[1].toFixed(1)}/10</em></div>
    <div><small>Oxirgi natija</small><b>${aiPts(ok[0].r)}</b><em>${d==null?'birinchi tekshiruv':d>0?'▲ +'+d+' oldingisidan':d<0?'▼ '+d+' oldingisidan':'oldingisi bilan teng'}</em></div></div>
    ${top.length?`<p class="sub2" style="margin:0 0 6px">Ko‘p takrorlanadigan xatolaringiz — shularga e’tibor bering:</p><ul class="aitop">${top.map(([t,n])=>`<li>${esc(AI_MT[t]||t)} × ${n}</li>`).join('')}</ul>`:''}`;
}

  au.addEventListener('pause',()=>{$('#pp').innerHTML=P;$('#pp').setAttribute('aria-label','Ijro etish')});
  $('#pp').onclick=()=>au.paused?au.play():au.pause();
  $('#bk').onclick=()=>{au.currentTime=Math.max(0,au.currentTime-10)};
  $('#sb').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};
}

/* ---------- menu ---------- */
function menu(){
  $('#ttl').textContent=DOC.short;$('#sub').textContent=DOC.title;
  $('#main').innerHTML=`<div class="menu">${DOC.sections.map(s=>{let r=null;try{r=JSON.parse(ls(ST+'mashq:'+UID+':'+H.d+':'+s.id)||'null')}catch(e){}const d=r&&r.r;
    return `<a href="#d=${esc(H.d)}&x=${s.id}"><span class="num">${esc(s.label.replace(/\D/g,'')||'•')}</span><span>${esc(s.label)} · ${esc(s.title)}<small>${Object.keys(s.ans).length?Object.keys(s.ans).length+' ta savol':s.kind==='study'?s.items.length+' ta ibora':s.kind==='write'?s.tasks.length+' ta topshiriq':''}</small></span>${d?`<em>${d.ok}/${d.of}</em>`:''}</a>`}).join('')}</div>`;
}

let fs=+(ls(ST+'fs')||17);
function setFs(){document.documentElement.style.setProperty('--fs',fs+'px');lset(ST+'fs',fs)}
$('#fsp').onclick=()=>{fs=Math.min(24,fs+1);setFs()};$('#fsm').onclick=()=>{fs=Math.max(14,fs-1);setFs()};setFs();

async function boot(){
  if('speak' in H){if(!SESSION||!SESSION.t||SESSION.role==='teacher'){fail('Avval kiring','AI Speaking yordamchidan foydalanish uchun platformaga o‘quvchi sifatida kiring.');return}watermark();speakPage();return}
  if('ai' in H){if(!SESSION||!SESSION.t||SESSION.role==='teacher'){fail('Avval kiring','AI Writing yordamchidan foydalanish uchun platformaga o‘quvchi sifatida kiring.');return}watermark();aiPage();return}
  if(!H.d||!/^[a-z0-9-]+$/.test(H.d)){fail('Mashq topilmadi','Havola noto‘g‘ri. Xaritadan qayta oching.','./#/me');return}
  if(H.a)$('#back').href='./#/me/a/'+encodeURIComponent(H.a);
  if(!ls(ST+'k')){fail('Avval kiring','Bu mashq faqat EDUNEST o‘quvchilari uchun. Platformaga kiring va xaritadan oching.');return}
  try{DOC=JSON.parse(new TextDecoder().decode(await load(H.d)))}
  catch(e){e.message==='net'?fail('Yuklanmadi','Internetni tekshirib, sahifani yangilang.','./#/me'):fail('Qayta kiring','Kirish muddati tugagan. Platformaga qaytadan kiring.');return}
  if(H.x==='all'&&DOC.exam){examBoot();return}
  SEC=DOC.sections.find(s=>s.id===H.x);
  if(!SEC){menu();return}
  restore();render();
}
addEventListener('hashchange',()=>location.reload());
boot();
</script>
